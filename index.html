<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
    <title>Odin: Calculator</title>
</head>
<body>
    <header>Odin: Calculator</header>
    <section class="calc">
        <div class="display">
            <div class="displayHistory">history</div>
            <div class="displayResult">current-result
            </div>
        </div>
        <div class="usrInput">
            <div class="main">
                <div class="reset">
                    <button class="resetbtn" id="ac">AC</button>
                    <button class="resetbtn" id="del">Del</button>
                </div>
                <div class="numpad">
                    <div class="row1">
                        <button class="numbtn" id="7">7</button>
                        <button class="numbtn" id="8">8</button>
                        <button class="numbtn" id="9">9</button>
                    </div>
                    <div class="row2">
                        <button class="numbtn" id="4">4</button>
                        <button class="numbtn" id="5">5</button>
                        <button class="numbtn" id="6">6</button>
                    </div>
                    <div class="row3">
                        <button class="numbtn" id="1">1</button>
                        <button class="numbtn" id="2">2</button>
                        <button class="numbtn" id="3">3</button>
                    </div>
                </div>
                <div class="modify">
                    <button class="numbtn" id="zero">0</button>
                    <button class="numbtn" id="deci">.</button>
                </div>
            </div>
            <div class="opr">
                <button class="oprbtn" id="/">/</button>
                <button class="oprbtn" id="*">x</button>
                <button class="oprbtn" id="-">-</button>
                <button class="oprbtn" id="+">+</button>
                <button class="oprbtn" id="=">=</button>
            </div>
        </div>
    </section>
</body>
</html>
